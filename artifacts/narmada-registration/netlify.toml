[build]
  command = "pnpm run build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9.15.4"
  PNPM_FLAGS = "--no-frozen-lockfile"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Prevent UI-installed plugins from timing out or failing the build
[[plugins]]
  package = "netlify-plugin-a11y"
  [plugins.inputs]
    testMode = true
    resultMode = "info"
    checkPaths = []

[[plugins]]
  package = "netlify-plugin-chromium"
  [plugins.inputs]
    failBuildOnError = false
