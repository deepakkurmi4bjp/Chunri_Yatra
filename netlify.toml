[build]
  command = "pnpm --filter @workspace/narmada-registration run build"
  publish = "artifacts/narmada-registration/dist/public"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9.15.4"
  PNPM_FLAGS = "--no-frozen-lockfile"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
